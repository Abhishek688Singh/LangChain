[project]
name = "langchainpractice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek Singh", email = "singh752008abhishek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.4.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.22",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "typing>=3.10.0.0",
]

[project.scripts]
langchainpractice = "langchainpractice:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
